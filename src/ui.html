<title>한판 세계여행</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 항공우편 봉투 위에 펼친 세계여행 판 — 위: 여행자 띠, 가운데: 판(가운데에 주사위·소식), 아래: 할 일. 넓은 화면은 오른쪽 패널 */
:root{
  --sky:#dde6ee; --sky-2:#cfdbe6; --paper:#fbfaf5; --paper-2:#f1efe6; --line:#c9cfd6;
  --ink:#16223a; --ink-soft:#5b6779; --air-red:#cf3239; --air-blue:#23489a; --gold:#d69e17; --gold-ink:#5a3d00;
  --s0:#e0703a; --s1:#22968a; --s2:#c08e00; --s3:#6b4fc4;
  --p0:#e5484d; --p1:#2563eb; --p2:#139a4a; --p3:#e58a00;
  --ok:#1d8a52; --warn:#c2410c; --panel:#ffffff; --panel-line:#d6dde5; --veil:rgba(14,22,38,.45);
  --shadow:0 1px 0 rgba(20,34,58,.08), 0 10px 26px rgba(20,34,58,.14);
  --f-display:"Black Han Sans","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0d1726; --sky-2:#132034; --paper:#1a2639; --paper-2:#213049; --line:#33445e;
  --ink:#e8eef6; --ink-soft:#9fb0c6; --air-red:#e0525a; --air-blue:#5b84d6; --gold:#e8b43a; --gold-ink:#3a2700;
  --s0:#f08a57; --s1:#3fb6a8; --s2:#d8a91c; --s3:#9a82ec;
  --p0:#ff6b70; --p1:#5b93ff; --p2:#2fc46c; --p3:#ffa62b;
  --ok:#3fbf7f; --warn:#fb8a4c; --panel:#18233a; --panel-line:#2c3c55; --veil:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0d1726; --sky-2:#132034; --paper:#1a2639; --paper-2:#213049; --line:#33445e;
  --ink:#e8eef6; --ink-soft:#9fb0c6; --air-red:#e0525a; --air-blue:#5b84d6; --gold:#e8b43a; --gold-ink:#3a2700;
  --s0:#f08a57; --s1:#3fb6a8; --s2:#d8a91c; --s3:#9a82ec;
  --p0:#ff6b70; --p1:#5b93ff; --p2:#2fc46c; --p3:#ffa62b;
  --ok:#3fbf7f; --warn:#fb8a4c; --panel:#18233a; --panel-line:#2c3c55; --veil:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--sky); color:var(--ink); font-family:var(--f-body); font-size:15px; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  background-image:radial-gradient(var(--sky-2) 1.2px, transparent 1.3px); background-size:18px 18px}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:default; opacity:.45}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:-.02em}

.app{min-height:100%; box-sizing:border-box; max-width:1180px; margin:0 auto; display:grid; gap:10px; align-content:start;
  padding-block:10px 16px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  grid-template-areas:"top" "ppl" "board" "act" "log"}
@media (min-width:920px){ .app{grid-template-columns:minmax(0,1fr) 340px; grid-template-areas:"top top" "board ppl" "board act" "board log"; grid-template-rows:auto auto auto 1fr} }
.top{grid-area:top; display:flex; align-items:center; gap:8px}
.logo{white-space:nowrap; font-family:var(--f-display); font-size:clamp(20px, 5.4vw, 26px); line-height:1; letter-spacing:.01em; display:flex; align-items:center; gap:8px}
.logo .stamp{width:30px; height:30px; flex:none}
.top .sp{flex:1}
.clock{font-family:var(--f-num); font-size:12px; color:var(--ink-soft); text-align:right; line-height:1.25}
.iconbtn{width:40px; height:40px; border-radius:12px; border:1px solid var(--panel-line); background:var(--panel); display:grid; place-items:center; flex:none}
.iconbtn svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* 여행자 띠 */
.ppl{grid-area:ppl; display:grid; grid-template-columns:repeat(var(--n,2), minmax(0,1fr)); gap:6px}
@media (min-width:920px){ .ppl{grid-template-columns:1fr 1fr} }
.pp{--c:var(--p0); position:relative; background:var(--panel); border:1px solid var(--panel-line); border-radius:12px; padding:7px 8px 7px 10px; min-width:0; display:grid; gap:1px; transition:transform .2s, box-shadow .2s; overflow:hidden}
.pp::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c)}
.pp .nm{font-weight:800; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px; min-width:0}
.pp .nm i{font-style:normal; font-weight:600; font-size:10.5px; color:var(--ink-soft)}
.pp .money{font-family:var(--f-num); font-weight:600; font-size:clamp(11.5px, 3.2vw, 14.5px); font-variant-numeric:tabular-nums; white-space:nowrap}
.pp .tags{display:flex; gap:3px; flex-wrap:wrap; min-height:15px}
.tag{font-size:10px; font-weight:700; padding:1px 5px; border-radius:6px; background:var(--paper-2); color:var(--ink-soft); white-space:nowrap}
.tag.gold{background:var(--gold); color:var(--gold-ink)}
.tag.red{background:var(--air-red); color:#fff}
.pp.on{box-shadow:0 0 0 2px var(--c), var(--shadow); transform:translateY(-1px)}
.pp.out{opacity:.45}
.pp.out .money{text-decoration:line-through}
.pp .tok{width:14px; height:14px; border-radius:50%; background:var(--c); flex:none; box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.pp .say{position:absolute; right:6px; top:4px; background:var(--ink); color:var(--paper); font-size:11px; padding:2px 7px; border-radius:9px; max-width:70%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pp .bar{position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--c); transform-origin:left; opacity:.8}

/* 판 */
.boardwrap{grid-area:board; justify-self:center; width:min(100%, 760px); min-width:0}
@media (min-width:920px){ .boardwrap{width:min(100%, calc(100vh - 90px), 820px); justify-self:stretch} }
.envelope{padding:7px; border-radius:14px; box-shadow:var(--shadow);
  background:repeating-linear-gradient(-45deg, var(--air-red) 0 12px, var(--paper) 12px 20px, var(--air-blue) 20px 32px, var(--paper) 32px 40px)}
.board{position:relative; aspect-ratio:1; max-width:100%; background:var(--paper); border-radius:8px; display:grid;
  grid-template-columns:1.45fr repeat(9, 1fr) 1.45fr; grid-template-rows:1.45fr repeat(9, 1fr) 1.45fr; overflow:hidden}
.tile{position:relative; border:.5px solid var(--line); margin:-.25px; background:var(--paper); padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; overflow:hidden; min-width:0; min-height:0; line-height:1.05; font-size:clamp(7.5px, 1.6vw, 12.5px)}
.tile .band{position:absolute; background:var(--sc)}
.tile.b-top .band{left:0; right:0; top:0; height:18%}
.tile.b-bottom .band{left:0; right:0; bottom:0; height:18%}
.tile.b-left .band{top:0; bottom:0; left:0; width:18%}
.tile.b-right .band{top:0; bottom:0; right:0; width:18%}
.tile .tn{font-weight:800; word-break:keep-all; overflow-wrap:anywhere; padding:0 2px; position:relative; z-index:1}
.tile .tp{font-family:var(--f-num); font-size:.82em; color:var(--ink-soft); margin-top:2px; position:relative; z-index:1}
.tile.b-top{padding-top:12%} .tile.b-bottom{padding-bottom:12%} .tile.b-left{padding-left:14%} .tile.b-right{padding-right:14%}
.tile.owned{background:color-mix(in srgb, var(--oc) 16%, var(--paper))}
.tile.owned .tp{color:var(--oc); font-weight:600}
.tile .own{position:absolute; width:15%; aspect-ratio:1; border-radius:50%; background:var(--oc); z-index:2; box-shadow:0 0 0 1.5px var(--paper)}
.tile.b-top .own{right:3%; bottom:3%} .tile.b-bottom .own{right:3%; top:3%} .tile.b-left .own{right:3%; bottom:5%} .tile.b-right .own{left:3%; bottom:5%}
.tile .bld{position:absolute; display:flex; gap:1px; z-index:2; align-items:flex-end}
.tile.b-top .bld{left:0; right:0; top:1%; height:16%; justify-content:center}
.tile.b-bottom .bld{left:0; right:0; bottom:1%; height:16%; justify-content:center}
.tile.b-left .bld{top:0; bottom:0; left:1%; width:16%; flex-direction:column; justify-content:center; align-items:center}
.tile.b-right .bld{top:0; bottom:0; right:1%; width:16%; flex-direction:column; justify-content:center; align-items:center}
.tile .bld svg{width:clamp(6px,1.5vw,12px); height:clamp(6px,1.5vw,12px); fill:var(--paper); stroke:var(--ink); stroke-width:1.4}
.tile.corner{font-size:clamp(8px, 1.8vw, 14px)}
.tile.corner svg.ic{width:46%; height:46%; stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.tile svg.ic{width:52%; height:42%; stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; position:relative; z-index:1}
.tile.key{background:color-mix(in srgb, var(--gold) 22%, var(--paper))}
.tile.key svg.ic{stroke:var(--gold-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile.key svg.ic{stroke:var(--gold)}}
:root[data-theme="dark"] .tile.key svg.ic{stroke:var(--gold)}
.tile.pick{cursor:pointer}
.tile.pick:hover{outline:2px solid var(--ok); outline-offset:-2px; z-index:3}
.tile.sel{outline:3px solid var(--ok); outline-offset:-3px; z-index:3}
.tile.flash{animation:flash .7s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 40px color-mix(in srgb, var(--gold) 70%, transparent)}100%{box-shadow:inset 0 0 0 0 transparent}}
.tile.here{box-shadow:inset 0 0 0 2px var(--hc)}
.tile:focus-visible{z-index:4}

.center{grid-row:2/11; grid-column:2/11; position:relative; display:grid; place-items:center; padding:4%; box-sizing:border-box; min-width:0; min-height:0;
  background:radial-gradient(color-mix(in srgb, var(--air-blue) 14%, transparent) 1px, transparent 1.2px) 0 0/10px 10px}
.cin{display:grid; justify-items:center; gap:clamp(4px,1.4vw,12px); width:100%; text-align:center}
.mark{font-family:var(--f-display); font-size:clamp(18px, 5vw, 40px); color:color-mix(in srgb, var(--air-blue) 70%, var(--paper)); letter-spacing:.02em; line-height:1}
.mark small{display:block; font-family:var(--f-num); font-size:.32em; letter-spacing:.3em; margin-top:4px; color:var(--ink-soft)}
.dice{display:flex; gap:clamp(6px,2vw,14px)}
.die{width:clamp(34px, 9vw, 64px); aspect-ratio:1; border-radius:22%; background:var(--panel); border:1.5px solid var(--ink); box-shadow:0 3px 0 var(--ink); display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:14%; box-sizing:border-box}
.die i{width:70%; aspect-ratio:1; border-radius:50%; background:var(--ink); place-self:center; visibility:hidden}
.die.dbl{border-color:var(--air-red); box-shadow:0 3px 0 var(--air-red)}
.die.dbl i{background:var(--air-red)}
.die.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg) translateY(-2px)}50%{transform:rotate(8deg) translateY(1px)}100%{transform:rotate(-8deg) translateY(-2px)}}
.news{word-break:keep-all; font-weight:700; font-size:clamp(12px, 2.6vw, 16px); min-height:2.6em; max-width:92%; text-wrap:balance; line-height:1.3}
.news b{color:var(--nc, var(--ink))}
.facts{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; font-size:clamp(10px,2vw,12.5px); color:var(--ink-soft)}
.facts span{background:var(--panel); border:1px solid var(--panel-line); border-radius:8px; padding:2px 7px; white-space:nowrap}
.facts b{font-family:var(--f-num); color:var(--ink)}

/* 황금열쇠 카드 */
.keycard{position:absolute; inset:12% 14%; display:grid; place-items:center; z-index:6; pointer-events:auto}
.keycard .kc{width:min(100%, 280px); background:linear-gradient(160deg, color-mix(in srgb, var(--gold) 82%, #fff), var(--gold)); color:var(--gold-ink); border-radius:14px; padding:14px 16px; box-shadow:0 14px 34px rgba(0,0,0,.3); text-align:center; display:grid; gap:6px; animation:cardin .35s cubic-bezier(.2,1.4,.4,1)}
.keycard .kc small{font-family:var(--f-num); font-size:11px; letter-spacing:.2em}
.keycard .kc h3{margin:0; font-family:var(--f-display); font-size:clamp(20px, 5vw, 28px); font-weight:400}
.keycard .kc p{margin:0; font-size:13.5px; line-height:1.45; font-weight:600}
@keyframes cardin{from{transform:rotateY(80deg) scale(.7); opacity:0} to{transform:none; opacity:1}}

/* 말 */
.toks{position:absolute; inset:0; pointer-events:none; z-index:5}
.tk{position:absolute; width:4.2%; aspect-ratio:1; border-radius:50% 50% 50% 0; transform:translate(-50%,-100%) rotate(-45deg); background:var(--c); box-shadow:0 0 0 2px var(--paper), 0 3px 6px rgba(0,0,0,.35); transition:left .11s linear, top .11s linear}
.tk::after{content:""; position:absolute; inset:28%; border-radius:50%; background:var(--paper)}
.tk.fly{transition:left .7s cubic-bezier(.45,0,.3,1), top .7s cubic-bezier(.45,0,.3,1)}
.tk.on{z-index:2; animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{margin-top:-4px}}
.fl{position:absolute; z-index:9; font-family:var(--f-num); font-weight:600; font-size:13px; padding:1px 6px; border-radius:8px; pointer-events:none; white-space:nowrap; animation:floatup 1.3s ease-out forwards}
.fl.plus{background:var(--ok); color:#fff} .fl.minus{background:var(--air-red); color:#fff}
@keyframes floatup{from{transform:translate(-50%,0); opacity:1} to{transform:translate(-50%,-26px); opacity:0}}

/* 할 일 */
.act{grid-area:act; background:var(--panel); border:1px solid var(--panel-line); border-radius:14px; padding:12px; display:grid; gap:10px; box-shadow:var(--shadow); min-width:0}
.act h2{margin:0; font-size:16px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.act h2 .dot{width:12px; height:12px; border-radius:50%; background:var(--c)}
.act p{margin:0; color:var(--ink-soft); font-size:13.5px; line-height:1.45}
.act .row{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1px solid var(--panel-line); background:var(--paper-2); border-radius:12px; padding:11px 14px; font-weight:700; font-size:15px; min-height:46px}
.btn.main{background:var(--air-blue); border-color:var(--air-blue); color:#fff}
.btn.red{background:var(--air-red); border-color:var(--air-red); color:#fff}
.btn.gold{background:var(--gold); border-color:var(--gold); color:var(--gold-ink)}
.btn.grow{flex:1}
.btn small{display:block; font-family:var(--f-num); font-weight:500; font-size:12px; opacity:.85}
.offer{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; align-items:center}
.offer dt{color:var(--ink-soft)} .offer dd{margin:0; font-family:var(--f-num); font-weight:600}
.opts{display:grid; gap:6px}
.opt{display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left; width:100%}
.opt span:last-child{font-family:var(--f-num); font-size:12.5px; font-weight:500; text-align:right}
.timer{height:4px; background:var(--paper-2); border-radius:3px; overflow:hidden}
.timer i{display:block; height:100%; background:var(--air-blue); transform-origin:left}
.timer.hurry i{background:var(--air-red)}

/* 기록 */
.log{grid-area:log; background:var(--panel); border:1px solid var(--panel-line); border-radius:14px; padding:10px 12px; font-size:12.5px; color:var(--ink-soft); max-height:220px; overflow:auto; min-width:0}
.log h3{margin:0 0 6px; font-size:12px; letter-spacing:.08em; color:var(--ink)}
.log ol{list-style:none; margin:0; padding:0; display:grid; gap:3px}
.log li b{color:var(--c, var(--ink))}
@media (max-width:919px){ .log{max-height:150px} }

/* 시트 */
.veil{position:fixed; inset:0; background:var(--veil); z-index:50; display:grid; align-items:end; justify-items:center; animation:fade .2s}
@media (min-width:640px){ .veil{align-items:center} }
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel); color:var(--ink); width:min(100%, 560px); max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; box-sizing:border-box;
  padding:18px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); box-shadow:var(--shadow)}
@media (min-width:640px){ .sheet{border-radius:18px} }
.sheet h2{margin:0 0 10px; font-family:var(--f-display); font-weight:400; font-size:24px}
.sheet h3{margin:16px 0 7px; font-size:13px; letter-spacing:.04em; color:var(--ink-soft)}
.sheet p{line-height:1.55; margin:6px 0}
.sheet .lead{color:var(--ink-soft); margin-top:0}
.hint{font-size:12.5px; color:var(--ink-soft)}
.tabs{display:grid; grid-template-columns:repeat(3,1fr); background:var(--paper-2); border-radius:12px; padding:3px; gap:3px; margin-bottom:12px}
.tabs button{border:0; background:none; border-radius:9px; padding:9px 4px; font-weight:700; font-size:14px}
.tabs button.on{background:var(--panel); box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{border:1px solid var(--panel-line); background:var(--paper-2); border-radius:10px; padding:8px 11px; font-weight:600; font-size:13.5px}
.seg button.on{background:var(--air-blue); border-color:var(--air-blue); color:#fff}
.field{width:100%; box-sizing:border-box; border:1px solid var(--panel-line); background:var(--paper); color:var(--ink); border-radius:10px; padding:10px 12px; font:inherit; font-size:16px}
.seats{display:grid; gap:6px}
.seatrow{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center}
.seatrow .tok, .lseat .tok{width:16px; height:16px; border-radius:50%; background:var(--c)}
.seatrow select{border:1px solid var(--panel-line); background:var(--paper); color:var(--ink); border-radius:10px; padding:9px 6px; font:inherit; font-size:14px}
.sw{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:center; padding:8px 0; border-top:1px solid var(--panel-line)}
.sw .t{font-weight:700; font-size:14px} .sw .d{grid-column:1; font-size:12.5px; color:var(--ink-soft); line-height:1.4}
.sw button{grid-row:1/3; grid-column:2; width:46px; height:28px; border-radius:14px; border:0; background:var(--line); position:relative}
.sw button::after{content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s}
.sw button.on{background:var(--ok)} .sw button.on::after{left:21px}
.btns{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; align-items:center}
.btns.col{flex-direction:column; align-items:stretch}
.btns .btn{flex:1}
.row2{display:flex; gap:8px}
.row2 .field{flex:1}
.code{display:flex; align-items:baseline; gap:10px; margin:4px 0 8px}
.code b{font-family:var(--f-num); font-size:30px; letter-spacing:.12em}
.lseats{display:grid; gap:6px}
.lseat{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; background:var(--paper-2)}
.lseat .n{flex:1; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lseat.empty .n{color:var(--ink-soft); font-weight:500}
.ctl{display:grid; gap:6px; margin-top:10px}
.ctl > span{font-size:13px; font-weight:700}
.props{display:grid; gap:6px}
.prop{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:8px 10px; border-radius:10px; background:var(--paper-2)}
.prop .sb{width:8px; align-self:stretch; border-radius:4px; background:var(--sc)}
.prop .pn{font-weight:700; min-width:0} .prop .pn small{display:block; font-weight:500; color:var(--ink-soft); font-size:12px}
.prop .btn{min-height:38px; padding:6px 10px; font-size:13px}
table.tolls{width:100%; border-collapse:collapse; font-size:13.5px}
.tolls td,.tolls th{padding:6px 4px; border-bottom:1px solid var(--panel-line); text-align:right}
.tolls th{text-align:left; font-weight:600}
.tolls td{font-family:var(--f-num)}
.tolls tr.now th,.tolls tr.now td{color:var(--air-blue); font-weight:800}
.joinbox{background:var(--paper-2); border-radius:12px; padding:10px 12px; margin:10px 0; display:grid; gap:8px}
.ranks{display:grid; gap:6px; margin:8px 0}
.rk{display:grid; grid-template-columns:28px 14px minmax(0,1fr) auto; gap:8px; align-items:center; padding:9px 10px; border-radius:10px; background:var(--paper-2)}
.rk b{font-family:var(--f-display); font-weight:400; font-size:20px}
.rk .tok{width:14px; height:14px; border-radius:50%; background:var(--c)}
.rk .n{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rk .v{font-family:var(--f-num); font-weight:600}

.toast.show{opacity:1; transform:translate(-50%, 0)}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:70}
.link{color:var(--air-blue); font-weight:700}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }

<script>/*ENGINE*/</script>
<script>/*AI*/</script>
<script>
'use strict';
var SERVER = '__SERVER_URL__';
var T = WT.T, N = WT.N;
var KEY = 'world-trip-v1';
var NAMES = ['비행기', '배낭', '여권', '캐리어'];
var BOTS = ['파랑새봇', '철새봇', '갈매기봇', '두루미봇'];
var LVNAME = { easy:'느긋한', normal:'야무진' };
var SAYS = ['안녕하세요!', '잘 부탁해요', '좋은 여행!', '아이고…', '부자 되세요', '통행료 감사해요', '조금만 봐줘요', '한 판 더?'];
var SHORT = { '부에노스아이레스':'부에노스', '초음속 여객기':'여객기', '호화 여객선':'여객선', '우주왕복선':'왕복선', '사회복지기금':'기금' };
var SIDE_NAME = ['아시아·아프리카', '유럽', '아메리카·오세아니아', '세계 대도시'];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function won(v){ // 천 원 단위 → '123만 4천'
  v = Math.round(v); var neg = v < 0; v = Math.abs(v);
  var man = Math.floor(v / 10), ch = v % 10, s;
  if (man && ch) s = man + '만 ' + ch + '천'; else if (man) s = man + '만'; else if (ch) s = ch + '천'; else s = '0';
  return (neg ? '−' : '') + s;
}
function pc(i){ return 'var(--p' + (G.players[i] ? G.players[i].color : i) + ')'; }
function pn(i){ return '<b style="--c:' + pc(i) + ';color:' + pc(i) + '">' + esc(G.players[i].name) + '</b>'; }
function tn(i){ return T[i].n; }

// ── 저장 ──
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
var store = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
if (store.sound == null) store.sound = true;
store.setup = store.setup || {};
var SU = store.setup;
SU.cpu = SU.cpu || { name:'', n:2, lv:'normal' };
SU.local = SU.local || { n:3, seats:[{name:'',who:'human'},{name:'',who:'human'},{name:'',who:'normal'},{name:'',who:'normal'}] };
SU.cfg = Object.assign({ start:2930, triple:true, buildOnBuy:false, len:'r20' }, SU.cfg || {});

function rnd(){ try{ var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }catch(e){ return Math.random(); } }
function die(){ return 1 + Math.floor(rnd() * 6); }

var G = null;          // 지금 판 (온라인은 서버가 보낸 화면)
var MODE = 'local';    // local | online
var busy = false;      // 애니메이션 중
var timer = 0;
var DP = [];           // 화면에 보이는 말 자리
var SEL = -1;          // 우주여행 고른 칸
var DEMO = false;      // 시작 화면 뒤의 보기용 판
var SHEET = '';
var NET = { ws:null, seat:-1, room:null, queue:[], pending:false, round:0 };
var SPEED = store.fast ? 0.55 : 1;
function ms(x){ return Math.round(x * SPEED); }

// ── 판 그리기 ──
function cellOf(i){ // [줄, 칸] (0~10)
  if (i <= 10) return [10, 10 - i];
  if (i <= 20) return [10 - (i - 10), 0];
  if (i <= 30) return [0, i - 20];
  return [i - 30, 10];
}
function bandSide(i){ var s = WT.sideOf(i); return ['b-top', 'b-right', 'b-bottom', 'b-left'][s]; }
var ICONS = {
  start:'<path d="M20 12H5M11 6l-6 6 6 6"/><path d="M20 6v12"/>',
  island:'<path d="M12 21c0-5 1-9 3-12"/><path d="M15 9c-2-3-6-3-8-1 3 0 5 1 8 1zM15 9c1-3 5-4 7-2-3 0-5 1-7 2zM15 9c-1 3-4 5-7 5 1-3 4-5 7-5z"/><path d="M3 21h18"/>',
  fund:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/><path d="M12 9v6M9.5 12h5"/>',
  space:'<path d="M12 3c3 2 5 6 4 11l-4 3-4-3c-1-5 1-9 4-11z"/><circle cx="12" cy="10" r="1.6"/><path d="M8 14l-3 3 1 3 3-2M16 14l3 3-1 3-3-2M10 19l2 3 2-3"/>',
  donate:'<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M9 9V7a3 3 0 0 1 6 0v2M12 13v3"/>',
  key:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M21 12v2"/>',
  JET:'<path d="M3 13l18-6-3 5-8 3-2 4-1-4z"/>',
  SHIP:'<path d="M4 15h16l-2 5H6z"/><path d="M7 15V9h10v6M10 9V5h4v4"/>',
  SHTL:'<path d="M12 2c2 2 3 5 3 9v6H9v-6c0-4 1-7 3-9z"/><path d="M9 13l-3 4v2h3M15 13l3 4v2h-3M11 21h2"/>',
  CJU:'<path d="M3 18l6-9 4 5 3-3 5 7z"/><circle cx="17" cy="6" r="2"/>',
  PUS:'<path d="M3 16c3-2 6-2 9 0s6 2 9 0"/><path d="M6 13V7l4-3 4 3v6"/><path d="M10 13V9"/>',
  SEL:'<path d="M12 3v4M9 7h6l1 3H8z"/><path d="M10 10v8M14 10v8M7 21h10M8 18h8"/>'
};
var BLD = {
  villa:'<svg viewBox="0 0 12 12"><path d="M2 6l4-4 4 4v5H2z"/></svg>',
  bldg:'<svg viewBox="0 0 12 12"><path d="M3 1h6v10H3z"/><path d="M5 3h2M5 6h2"/></svg>',
  hotel:'<svg viewBox="0 0 12 12"><path d="M1 3h10v8H1z"/><path d="M3 1h6v2"/><path d="M5 11V7h2v4"/></svg>'
};
var tileEls = [];
function drawBoard(){
  var bd = $('board');
  tileEls.forEach(function(e){ e.remove(); });
  tileEls = [];
  for (var i = 0; i < N; i++){
    var t = T[i], c = cellOf(i), d = document.createElement('button');
    d.className = 'tile';
    d.style.gridRow = (c[0] + 1); d.style.gridColumn = (c[1] + 1);
    d.dataset.i = i;
    var name = SHORT[t.n] || t.n, html = '';
    var corner = i % 10 === 0;
    if (corner) d.classList.add('corner');
    if (t.k === 'city'){
      d.classList.add(bandSide(i));
      d.style.setProperty('--sc', 'var(--s' + WT.sideOf(i) + ')');
      html = '<span class="band"></span><span class="tn">' + esc(name) + '</span><span class="tp"></span><span class="bld"></span>';
    } else if (t.k === 'spot' || t.k === 'ride'){
      d.classList.add(bandSide(i));
      html = '<svg class="ic" viewBox="0 0 24 24">' + (ICONS[t.en] || '') + '</svg><span class="tn">' + esc(name) + '</span><span class="tp"></span>';
    } else if (t.k === 'key'){
      d.classList.add('key');
      html = '<svg class="ic" viewBox="0 0 24 24">' + ICONS.key + '</svg><span class="tn">황금열쇠</span>';
    } else {
      var lab = { start:'출발', island:'무인도', fund:'복지기금<br>받기', space:'우주여행', donate:'복지기금<br>내기' }[t.k];
      html = '<svg class="ic" viewBox="0 0 24 24">' + (ICONS[t.k] || '') + '</svg><span class="tn">' + lab + '</span>';
      if (t.k === 'donate') html += '<span class="tp">15만</span>';
      if (t.k === 'start') html += '<span class="tp">월급 20만</span>';
    }
    d.innerHTML = html;
    d.setAttribute('aria-label', t.n);
    d.onclick = onTile;
    bd.insertBefore(d, $('center'));
    tileEls.push(d);
  }
}
function renderTiles(){
  var here = {};
  if (G && G.phase !== 'over'){ var cp = G.players[G.turn]; if (cp) here[DP[G.turn] != null ? DP[G.turn] : cp.pos] = pc(G.turn); }
  for (var i = 0; i < N; i++){
    var d = tileEls[i], t = T[i];
    if (!WT.isDeed(i)) continue;
    var o = G ? G.own[i] : -1, lv = G ? G.lv[i] : 0;
    d.classList.toggle('owned', o >= 0);
    if (o >= 0) d.style.setProperty('--oc', pc(o)); else d.style.removeProperty('--oc');
    var tp = d.querySelector('.tp');
    tp.textContent = o >= 0 ? won(WT.tollOf(G, i)) : won(t.p);
    var ownEl = d.querySelector('.own');
    if (o >= 0 && !ownEl){ ownEl = document.createElement('span'); ownEl.className = 'own'; d.appendChild(ownEl); }
    if (o < 0 && ownEl) ownEl.remove();
    var b = d.querySelector('.bld');
    if (b){
      var h = '';
      if (lv === 1) h = BLD.villa; else if (lv === 2) h = BLD.villa + BLD.villa; else if (lv === 3) h = BLD.bldg; else if (lv === 4) h = BLD.hotel;
      if (b.innerHTML !== h) b.innerHTML = h;
    }
    d.setAttribute('aria-label', t.n + (o >= 0 ? ', ' + G.players[o].name + ' 땅, ' + WT.LV_NAME[lv] + ', 통행료 ' + won(WT.tollOf(G, i)) : ', ' + won(t.p)));
  }
  var picking = G && G.phase === 'space' && myTurn() && !busy;
  tileEls.forEach(function(d, i){
    d.classList.toggle('pick', picking && i !== WT.SPACE);
    d.classList.toggle('sel', picking && i === SEL);
  });
}

// 말 자리 (판 기준 %)
function tokPos(i, k, cnt){
  var c = cellOf(i);
  var colW = [1.45].concat(Array(9).fill(1)).concat([1.45]), tot = 11.9;
  function at(arr, idx){ var s = 0; for (var j = 0; j < idx; j++) s += arr[j]; return (s + arr[idx] / 2) / tot * 100; }
  var x = at(colW, c[1]), y = at(colW, c[0]);
  var off = [[-1.6, -0.6], [1.6, -0.6], [-1.6, 2.4], [1.6, 2.4]];
  if (cnt > 1){ x += off[k][0]; y += off[k][1]; } else y += 1.2;
  return [x, y];
}
var tokEls = [];
function buildToks(){
  $('toks').innerHTML = ''; tokEls = [];
  G.players.forEach(function(p, i){
    var e = document.createElement('div'); e.className = 'tk'; e.style.setProperty('--c', pc(i));
    $('toks').appendChild(e); tokEls.push(e);
  });
  DP = G.players.map(function(p){ return p.pos; });
  placeToks();
}
function placeToks(){
  var groups = {};
  G.players.forEach(function(p, i){ if (p.out) return; var at = DP[i]; (groups[at] = groups[at] || []).push(i); });
  G.players.forEach(function(p, i){
    var e = tokEls[i]; if (!e) return;
    e.hidden = !!p.out;
    if (p.out) return;
    var g = groups[DP[i]], k = g.indexOf(i), xy = tokPos(DP[i], k, g.length);
    e.style.left = xy[0] + '%'; e.style.top = xy[1] + '%';
    e.classList.toggle('on', G.phase !== 'over' && G.turn === i);
  });
}

// ── 사람/차례 ──
function isAway(i){ var R = NET.room; return !!(R && R.seats[i] && R.seats[i].away); }
function myTurn(){
  if (!G || G.phase === 'over') return false;
  var p = G.players[G.turn];
  if (MODE === 'online') return G.turn === NET.seat && !isAway(NET.seat);
  return !p.ai;
}

// ── 여행자 띠 ──
function renderPeople(){
  var box = $('ppl'); box.style.setProperty('--n', G.players.length);
  var R = NET.room, sayOn = MODE === 'online' && R && R.say && Date.now() < (NET.sayUntil || 0);
  box.innerHTML = G.players.map(function(p, i){
    var tags = [];
    if (p.isl > 0) tags.push('<span class="tag">무인도 ' + p.isl + '</span>');
    if (p.spc) tags.push('<span class="tag">우주 정거장</span>');
    if (p.esc) tags.push('<span class="tag gold">무전기' + (p.esc > 1 ? '×' + p.esc : '') + '</span>');
    if (p.vip) tags.push('<span class="tag gold">우대권' + (p.vip > 1 ? '×' + p.vip : '') + '</span>');
    if (p.out) tags.push('<span class="tag red">파산</span>');
    var sub = '';
    if (MODE === 'online' && R){
      var s = R.seats[i] || {};
      if (i === NET.seat) sub = '나';
      else if (s.kind === 'bot') sub = s.left ? '컴퓨터가 대신' : '컴퓨터';
      else if (s.kind === 'human' && !s.online) sub = '연결 끊김';
      if (isAway(i)) tags.push('<span class="tag">자리 비움</span>');
    } else if (p.ai) sub = LVNAME[p.ai] || '컴퓨터';
    if (sub){ tags.unshift('<span class="tag">' + sub + '</span>'); sub = ''; }
    var say = sayOn && R.say.seat === i ? '<span class="say">' + esc(SAYS[R.say.k]) + '</span>' : '';
    var bar = '';
    if (MODE === 'online' && R && R.deadline && G.turn === i && G.phase !== 'over') bar = '<span class="bar" id="tbar"></span>';
    return '<div class="pp' + (G.turn === i && G.phase !== 'over' ? ' on' : '') + (p.out ? ' out' : '') + '" style="--c:' + pc(i) + '" id="pp' + i + '">' +
      '<span class="nm"><span class="tok"></span><span style="overflow:hidden;text-overflow:ellipsis">' + esc(p.name) + '</span>' + (sub ? '<i>' + sub + '</i>' : '') + '</span>' +
      '<span class="money">' + won(p.money) + '</span><span class="tags">' + tags.join('') + '</span>' + say + bar + '</div>';
  }).join('');
}

function renderFacts(){
  var f = [];
  f.push('<span>' + G.round + (G.cfg.rounds ? ' / ' + G.cfg.rounds : '') + '바퀴째</span>');
  f.push('<span>복지기금 <b>' + won(G.fund) + '</b></span>');
  if (G.lastRound) f.push('<span>마지막 바퀴</span>');
  $('facts').innerHTML = f.join('');
}
function setNews(html, color){ var n = $('news'); n.innerHTML = html; n.style.setProperty('--nc', color || 'var(--ink)'); }

function showDice(d, dbl){
  [0, 1].forEach(function(k){
    var el = $('d' + k), v = d ? d[k] : 0;
    if (!el.firstChild) el.innerHTML = '<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>';
    var on = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] }[v] || [];
    [].forEach.call(el.children, function(p, j){ p.style.visibility = on.indexOf(j) >= 0 ? 'visible' : 'hidden'; });
    el.classList.toggle('dbl', !!dbl);
  });
}

// ── 할 일 ──
function renderAct(){
  var box = $('act'), html = '';
  if (!G){ box.innerHTML = ''; return; }
  var p = G.players[G.turn], col = pc(G.turn);
  var head = function(t){ return '<h2 style="--c:' + col + '"><span class="dot"></span>' + t + '</h2>'; };
  var timerBar = MODE === 'online' && NET.room && NET.room.deadline && G.phase !== 'over' ? '<div class="timer" id="tline"><i></i></div>' : '';
  if (G.phase === 'over'){
    html = head('여행 끝') + '<p>' + pn(G.winner) + ' 님이 1등이에요.</p><div class="row"><button class="btn main grow" id="aOver">결과 보기</button></div>';
  } else if (busy){
    html = head(esc(p.name) + ' 차례') + '<p>이동하는 중…</p>';
  } else if (MODE === 'online' && G.turn === NET.seat && isAway(NET.seat)){
    html = head('자리 비움') + '<p>시간이 두 번 지나서 컴퓨터가 대신 두고 있어요.</p><div class="row"><button class="btn main grow" id="aBack">돌아왔어요</button></div>';
  } else if (!myTurn()){
    var who = p.ai || (MODE === 'online' && NET.room && NET.room.seats[G.turn] && NET.room.seats[G.turn].kind === 'bot') ? '컴퓨터가 생각하는 중…' : esc(p.name) + ' 님을 기다리는 중…';
    html = head(esc(p.name) + ' 차례') + timerBar + '<p>' + who + '</p>' + myStuffBtn();
  } else {
    var mine = MODE === 'online' || G.players.filter(function(x){ return !x.ai; }).length === 1 ? '내 차례' : esc(p.name) + ' 차례';
    switch (G.phase){
      case 'roll':
        if (p.isl > 0){
          html = head(mine + ' · 무인도') + timerBar + '<p>더블이 나오면 바로 나가요. 앞으로 ' + p.isl + '번 갇혀 있어요.</p>' +
            '<div class="row"><button class="btn main grow" id="aRoll">주사위 굴리기</button>' + (p.esc ? '<button class="btn gold" id="aEsc">무전기 쓰기</button>' : '') + '</div>';
        } else {
          html = head(mine) + timerBar + (G.again ? '<p>더블! 한 번 더 굴려요.</p>' : '') +
            '<div class="row"><button class="btn main grow" id="aRoll">주사위 굴리기</button></div>';
        }
        html += myStuffBtn();
        break;
      case 'space':
        html = head(mine + ' · 우주여행') + timerBar + '<p>판에서 가고 싶은 칸을 누르세요. 출발을 지나면 월급을 받아요.</p>' +
          '<div class="row"><button class="btn main grow" id="aFly"' + (SEL < 0 ? ' disabled' : '') + '>' + (SEL < 0 ? '칸을 고르세요' : esc(tn(SEL)) + '(으)로 날아가기') + '</button></div>';

// 사건 → 문장
function say(e, g){
  var P = function(i){ return '<b style="color:' + pc(i) + '">' + esc(g.players[i].name) + '</b>'; };
  var who = function(to){ return to >= 0 ? P(to) + ' 님에게' : to === -2 ? '복지기금에' : '은행에'; };
  switch (e.k){
    case 'roll': return P(e.p) + ' ' + e.d[0] + '+' + e.d[1] + (e.d[0] === e.d[1] ? ' 더블!' : '');
    case 'buy': return P(e.p) + ' 님이 ' + tn(e.t) + '을(를) 샀어요 (' + won(e.a) + ')';
    case 'build': return P(e.p) + ' 님이 ' + tn(e.t) + '에 ' + WT.LV_NAME[e.lv] + (e.lv === 2 ? '로 늘렸어요' : '을(를) 지었어요') + ' (' + won(e.a) + ')';
    case 'toll': return P(e.p) + ' 님이 ' + P(e.to) + ' 님에게 ' + tn(e.t) + ' 통행료 ' + won(e.a);
    case 'salary': return P(e.p) + ' 월급 +' + won(e.a);
    case 'key': return P(e.p) + ' 황금열쇠 「' + WT.KEYS[e.c].n + '」';
    case 'island': return P(e.p) + ' 님이 무인도에 갇혔어요';
    case 'stay': return P(e.p) + ' 님은 무인도에 그대로 (' + e.left + '번 남음)';
    case 'out': return P(e.p) + ' 님이 더블로 무인도를 빠져나왔어요';
    case 'radio': return P(e.p) + ' 님이 무전기로 구조 요청! 무인도를 나가요';
    case 'triple': return P(e.p) + ' 더블 세 번! 무인도로 가요';
    case 'fund': return P(e.p) + ' 님이 복지기금 ' + won(e.a) + (e.a ? '을 받았어요' : ' (모인 돈이 없어요)');
    case 'donate': return P(e.p) + ' 님이 복지기금 ' + won(e.a) + '을 냈어요';
    case 'spacefee': return P(e.p) + ' 님이 ' + P(e.to) + ' 님에게 왕복선 이용료 ' + won(e.a);
    case 'spaceport': return P(e.p) + ' 님이 우주 정거장에 왔어요. 다음 차례에 원하는 곳으로!';
    case 'fly': return P(e.p) + ' 님이 ' + tn(e.to) + '(으)로 날아가요';
    case 'cant': return P(e.p) + ' 님은 ' + tn(e.t) + '을(를) 살 돈이 모자라요';
    case 'skip': return P(e.p) + ' 님이 ' + tn(e.t) + (e.ph === 'buy' ? '을(를) 사지 않았어요' : '에 짓지 않았어요');
    case 'vip': return P(e.p) + ' 님이 우대권으로 통행료 ' + won(e.a) + '을 아꼈어요';
    case 'sell': return P(e.p) + ' 님이 ' + tn(e.t) + (e.lv < 0 ? ' 땅을' : '의 건물을') + ' 은행에 팔았어요 (+' + won(e.a) + ')';
    case 'sellcard': return P(e.p) + ' 님이 무전기를 은행에 팔았어요 (+' + won(e.a) + ')';
    case 'paid': return P(e.p) + ' 님이 ' + who(e.to) + ' ' + won(e.a) + '을 갚았어요';
    case 'gift': return P(e.p) + ' → ' + P(e.to) + ' ' + won(e.a);
    case 'tax': return P(e.p) + ' 님이 ' + won(e.a) + '을 냈어요';
    case 'halfsale': return P(e.p) + ' 님의 ' + tn(e.t) + '이(가) 반값 ' + won(e.a) + '에 팔렸어요';
    case 'nohalf': return P(e.p) + ' 님은 팔 땅이 없어서 그냥 넘어가요';
    case 'bankrupt': return P(e.p) + ' 님이 파산했어요' + (e.to >= 0 ? ' (' + P(e.to) + ' 님에게 ' + won(e.a) + ')' : '');
    case 'lastround': return '시간이 다 됐어요. 이번 바퀴가 마지막!';
    case 'over': return P(e.w) + ' 님이 1등! 여행 끝';
  }

function wait(t){ return new Promise(function(r){ setTimeout(r, ms(t)); }); }

}

var keyT = 0, keySkip = null;

async function play(g){
  busy = true;
  var old = G;
  // 화면에는 바뀐 돈을 사건마다 보여 주려고 이전 상태에서 시작
  var money = old.players.map(function(p){ return p.money; });
  G = Object.assign({}, old, { players:old.players.map(function(p, i){ return Object.assign({}, p, { name:g.players[i].name, ai:g.players[i].ai }); }) });
  renderAct();
  var evs = g.last || [];
  for (var k = 0; k < evs.length; k++){
    var e = evs[k], line = say(e, g);
    if (line && e.k !== 'roll') logLine(line);
    switch (e.k){
      case 'roll': setNews(line); logLine(line); await rollAnim(e.d); await wait(150); break;
      case 'move':
        if (Math.abs(e.n) >= 40){ setNews(pn2(g, e.p) + ' 세계일주!'); }
        await stepAnim(e.p, e.from, e.n); await wait(120); break;
      case 'warp': await flyAnim(e.p, e.to, 600); break;
      case 'fly': setNews(line); await flyAnim(e.p, e.to, 800); break;
      case 'salary': money[e.p] += e.a; setMoney(e.p, money[e.p]); floatAt(e.p, '+' + won(e.a), true); snd('coin'); break;
      case 'key': setNews(line); await showKey(e.c, isMineSeat(e.p)); break;
      case 'buy': flashTile(e.t); money[e.p] -= e.a; setMoney(e.p, money[e.p]); floatAt(e.p, '−' + won(e.a)); snd('buy'); setNews(line); G.own = G.own.slice(); G.own[e.t] = e.p; renderTiles(); await wait(650); break;
      case 'build': flashTile(e.t); money[e.p] -= e.a; setMoney(e.p, money[e.p]); floatAt(e.p, '−' + won(e.a)); snd('build'); setNews(line); G.lv = G.lv.slice(); G.lv[e.t] = e.lv; renderTiles(); await wait(650); break;
      case 'toll': case 'spacefee': case 'gift':
        money[e.p] -= e.a; money[e.to] += e.a; setMoney(e.p, money[e.p]); setMoney(e.to, money[e.to]);
        floatAt(e.p, '−' + won(e.a)); floatAt(e.to, '+' + won(e.a), true); snd(e.k === 'gift' ? 'coin' : 'pay'); setNews(line); await wait(e.k === 'gift' ? 380 : 800); break;
      case 'donate': case 'tax': setNews(line); snd('pay'); await wait(700); break;
      case 'fund': if (e.a){ money[e.p] += e.a; setMoney(e.p, money[e.p]); floatAt(e.p, '+' + won(e.a), true); snd('coin'); } setNews(line); await wait(700); break;
      case 'island': case 'triple': setNews(line); snd('sad'); await wait(700); break;
      case 'stay': case 'out': case 'radio': case 'spaceport': case 'cant': case 'vip': case 'halfsale': case 'nohalf': case 'lastround':
        setNews(line); await wait(650); break;
      case 'sell': case 'sellcard': case 'paid': setNews(line); snd('coin'); await wait(e.auto ? 260 : 420); break;
      case 'skip': setNews(line); await wait(250); break;
      case 'bankrupt': setNews(line); snd('sad'); await wait(1100); break;
      case 'over': setNews(line); break;
    }
  }
  G = g; busy = false;
  DP = g.players.map(function(p){ return p.pos; });
  render();
  if (!evs.some(function(e){ return e.k !== 'roll' && e.k !== 'move' && e.k !== 'turn' && e.k !== 'salary'; })){
    var last = evs.filter(function(e){ return e.k !== 'turn'; }).pop();
    if (last && last.k === 'move') setNews(pn2(g, last.p) + ' 님이 ' + esc(tn(last.to)) + '에 도착');
  }
  if (g.phase !== 'over' && evs.some(function(e){ return e.k === 'turn'; })){
    setTimeout(function(){ if (!busy && G === g) setNews(pn2(g, g.turn) + ' 님 차례'); }, ms(500));
  }
  if (autoPay && g.phase === 'pay' && myTurn()) setTimeout(autoSell, ms(150)); else autoPay = false;
  if (g.phase === 'over' && SHEET !== 'over'){ snd('win'); confetti(); setTimeout(overSheet, ms(900)); }
  else if (myTurn()) snd('turn');
}
function pn2(g, i){ return '<b style="color:' + pc(i) + '">' + esc(g.players[i].name) + '</b>'; }
function isMineSeat(i){ return MODE === 'online' ? i === NET.seat : !G.players[i].ai; }

function render(){
  if (!G) return;
  if (tokEls.length !== G.players.length) buildToks();
  if (!busy) DP = G.players.map(function(p){ return p.pos; });
  renderPeople(); renderTiles(); placeToks(); renderFacts(); renderAct(); updateClock();
  $('bSay').hidden = MODE !== 'online';
}

// ── 동작 ──
function act(a){
  if (busy || !G) return;
  if (MODE === 'online'){
    if (!myTurn()) return;
    sendAction(a);
    return;
  }
  if (a.type === 'roll') a = { type:'roll', d:[die(), die()] };
  var ng = WT.apply(G, a);
  if (ng === G) return;
  if (a.type === 'space') SEL = -1;
  persistLater(ng);
  play(ng).then(next);
}
function autoSell(){
  if (busy || !G || G.phase !== 'pay' || !myTurn()) return;
  autoPay = true;
  var me = G.turn, p = G.players[me];
  if (p.esc){ act({ type:'sellCard' }); return; }
  var ord = WT.autoSellOrder(G, me);
  if (ord.length) act({ type:'sell', t:ord[0] });
}
// 갚기 중 '알아서 팔기'는 다 갚을 때까지 이어서
var autoPay = false;

function next(){
  if (MODE === 'online' || !G) return;
  persist();
  clearTimeout(timer);
  if (G.phase === 'over') return;
  if (checkTime()) return;
  var p = G.players[G.turn];
  if (p.ai){
    timer = setTimeout(function(){
      if (busy || MODE !== 'local') return;
      var a = WAI.choose(G, p.ai, rnd);
      if (a) act(a);
    }, ms(G.phase === 'roll' ? 650 : 520));
  }
}
function checkTime(){
  if (MODE !== 'local' || !G || G.phase === 'over' || !G.cfg.timeMin || G.lastRound || busy) return false;
  if (Date.now() - G.t0 >= G.cfg.timeMin * 60000){ act({ type:'lastRound' }); return true; }
  return false;
}
function updateClock(){
  var c = $('clock'); if (!G){ c.textContent = ''; return; }
  var now = Date.now() + (MODE === 'online' ? (NET.off || 0) : 0);
  if (G.cfg.timeMin && G.phase !== 'over'){
    var left = Math.max(0, G.cfg.timeMin * 60000 - (now - G.t0)), m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    c.innerHTML = G.lastRound ? '마지막<br>바퀴' : '남은 시간<br>' + m + ':' + (s < 10 ? '0' : '') + s;
  } else if (G.cfg.rounds) c.innerHTML = G.round + '/' + G.cfg.rounds + '<br>바퀴';
  else c.innerHTML = G.round + '바퀴째';
}
function updateTimer(){
  var R = NET.room;
  var line = $('tline'), bar = $('tbar');
  if (!(MODE === 'online' && R && R.deadline && G && G.phase !== 'over')) return;
  var now = Date.now() + (NET.off || 0), tot = R.turnSec * 1000, left = Math.max(0, R.deadline - now);
  var f = Math.min(1, left / tot);
  if (line){ line.querySelector('i').style.transform = 'scaleX(' + f + ')'; line.classList.toggle('hurry', left < 5000); }
  if (bar) bar.style.transform = 'scaleX(' + f + ')';
  if (myTurn() && left < 5000 && left > 0){ var sec = Math.ceil(left / 1000); if (sec !== NET.beep){ NET.beep = sec; snd('beep'); } }
}
setInterval(function(){ updateClock(); updateTimer(); if (!busy && MODE === 'local') { if (checkTime()) return; } }, 250);

function tileSheet(i){
  var t = T[i], html = '<h2>' + esc(t.n) + '</h2>';

    var o = G ? G.own[i] : -1, lv = G ? G.lv[i] : 0;
    html += '<p class="lead">' + (t.k === 'city' ? SIDE_NAME[WT.sideOf(i)] + ' · ' : t.k === 'spot' ? '관광지 · 건물을 지을 수 없어요 · ' : '탈것 · ') + '땅값 ' + won(t.p) + '</p>';

function startLocal(tab){
  var ps = [];
  if (tab === 'cpu'){
    ps.push({ name:(SU.cpu.name || '').trim() || '나', ai:null });
    for (var i = 0; i < SU.cpu.n; i++) ps.push({ name:BOTS[i], ai:SU.cpu.lv });
  } else {
    for (var j = 0; j < SU.local.n; j++){
      var s = SU.local.seats[j];
      ps.push({ name:(s.name || '').trim() || (s.who === 'human' ? NAMES[j] : BOTS[j]), ai:s.who === 'human' ? null : s.who });
    }
  }
  var cfg = lenToCfg(SU.cfg.len, { start:SU.cfg.start, triple:SU.cfg.triple, buildOnBuy:SU.cfg.buildOnBuy });
  var seed = Math.floor(rnd() * 4294967296);
  MODE = 'local'; DEMO = false;
  G = WT.newGame(ps, cfg, Math.floor(rnd() * ps.length), seed, Date.now());
  store.mode = tab; LOG = []; $('logl').innerHTML = ''; SEL = -1;
  buildToks(); showDice([1, 1]);
  render(); setNews(pn(G.turn) + ' 님부터 출발!'); logLine('여행 시작! ' + pn(G.turn) + ' 님부터');
  persist(); next();
}

var persistT = 0;
function persist(){ if (MODE !== 'local' || !G || DEMO) return; store.game = G; store.seen = Date.now(); save(); }
function persistLater(g){ if (MODE !== 'local' || DEMO) return; store.game = g; store.seen = Date.now(); clearTimeout(persistT); persistT = setTimeout(save, 50); }
document.addEventListener('visibilitychange', function(){
  if (MODE !== 'local' || !G) return;
  if (document.hidden){ persist(); }
  else if (store.seen && G.cfg.timeMin){ var gap = Date.now() - store.seen; if (gap > 5000){ G.t0 += gap; persist(); } }
});

    '<button class="btn" id="mClose">닫기</button></div>';
  var sh = openSheet(html, 'menu');
  var on = function(id, f){ var e = sh.querySelector('#' + id); if (e) e.onclick = f; };
  on('mNew', function(){ setupSheet(store.mode === 'local' ? 'local' : 'cpu'); });
  on('mRules', rulesSheet);
  on('mFast', function(){ store.fast = !store.fast; SPEED = store.fast ? 0.55 : 1; save(); closeSheet(); toast(store.fast ? '움직임을 빠르게 했어요' : '보통 빠르기로 했어요'); });
  on('mOn', function(){ setupSheet('online'); });
  on('mClose', closeSheet);
  on('mInv', function(){ copyLink(location.origin + location.pathname + '#' + NET.code); });
  var lv = sh.querySelector('#mLeave');
  if (lv) lv.onclick = function(){
    if (lv.dataset.arm){ leaveOnline(); return; }
    lv.dataset.arm = 1; lv.textContent = G && G.phase !== 'over' && NET.room && NET.room.status === 'playing' ? '나가면 컴퓨터가 이어서 해요. 한 번 더 누르면 나가요' : '한 번 더 누르면 나가요';
  };
}
function copyLink(link){
  try{ navigator.clipboard.writeText(link).then(function(){ toast('초대 링크를 복사했어요'); }, function(){ toast(link); }); }catch(e){ toast(link); }
}

// ── 온라인 ──
function newPid(){ var a = new Uint8Array(16); try{ crypto.getRandomValues(a); }catch(e){ for (var i = 0; i < 16; i++) a[i] = Math.random()*256|0; } return Array.prototype.map.call(a, function(b){ return ('0' + b.toString(16)).slice(-2); }).join(''); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
NET.pid = lsGet('wt-pid'); if (!NET.pid){ NET.pid = newPid(); lsSet('wt-pid', NET.pid); }
NET.send = function(o){ try{ if (NET.ws && NET.ws.readyState === 1){ NET.ws.send(JSON.stringify(o)); return true; } }catch(e){} return false; };
function sendAction(a){
  if (NET.pending) return;
  if (!NET.send({ t:'act', a:a, seq:G.seq })){ toast('연결이 끊겨 있어요. 다시 잇는 중…'); return; }
  NET.pending = true;
  if (a.type === 'space') SEL = -1;
  clearTimeout(NET.pendT);
  NET.pendT = setTimeout(function(){ NET.pending = false; if (!busy) render(); }, 5000);
}
function api(path){
  return fetch(SERVER + path, { method:'POST', headers:{ 'content-type':'application/json' }, body:'{}' })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j || !j.code) throw new Error(j && j.error || '서버에 닿지 않아요'); return j.code; });
}
function goOnline(code, name){
  name = (name || '').trim() || '손님';
  store.netName = name; save();
  lsSet('wt-room', code);
  if (MODE === 'local' && G && G.phase !== 'over') persist();
  clearTimeout(timer);
  MODE = 'online'; DEMO = false; NET.code = code; NET.room = null; NET.queue = []; NET.round = 0; NET.retry = 0; NET.fatal = false; NET.closing = false;
  busy = false;
  try{ history.replaceState(null, '', '#' + code); }catch(e){}
  closeSheet(); toast('방 ' + code + '에 들어가는 중…');
  connect();
}
function connect(){
  var url = SERVER.replace(/^http/, 'ws') + '/ws/' + NET.code + '?pid=' + NET.pid + '&name=' + encodeURIComponent(store.netName || '손님');
  var ws;
  try{ ws = new WebSocket(url); }catch(e){ toast('서버에 연결하지 못했어요'); return; }
  NET.ws = ws;
  ws.onopen = function(){ NET.retry = 0; clearInterval(NET.ping); NET.ping = setInterval(function(){ try{ ws.send('ping'); }catch(e){} }, 25000); };
  ws.onmessage = function(e){
    if (e.data === 'pong') return;
    var m; try{ m = JSON.parse(e.data); }catch(x){ return; }
    if (m.t === 'error'){
      if (m.fatal){ NET.fatal = true; leaveOnline(m.message); return; }
      toast(m.message); NET.pending = false; if (!busy && G) render();
      return;
    }
    if (m.t === 'state') onState(m);
  };
  ws.onclose = function(){
    clearInterval(NET.ping);
    if (NET.ws !== ws || NET.fatal || NET.closing || MODE !== 'online') return;
    NET.pending = false;
    var w = Math.min(8000, 800 * Math.pow(2, NET.retry++));
    toast('연결이 끊겼어요. 다시 잇는 중…');
    setTimeout(function(){ if (MODE === 'online' && NET.ws === ws && !NET.closing) connect(); }, w);
  };
}
function leaveOnline(msg){
  NET.closing = true;
  NET.send({ t:'leave' });
  var ws = NET.ws; NET.ws = null;
  setTimeout(function(){ try{ ws && ws.close(); }catch(e){} }, 150);
  lsSet('wt-room', null);
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  MODE = 'local'; NET.room = null; NET.queue = []; NET.seat = -1; NET.pending = false;
  busy = false; closeSheet();
  if (store.game && store.game.v === 1 && store.game.phase !== 'over'){ G = store.game; buildToks(); render(); setNews('하던 여행을 이어서 해요'); next(); }
  else { G = null; demoBoard(); setupSheet('online'); }
  if (msg) toast(msg);
}
function onState(m){
  var R = m.room;
  NET.off = m.now - Date.now();
  NET.seat = m.seat;
  NET.room = R;
  if (R.say){ var k = R.say.seat + ':' + R.say.at; if (k !== NET.sayKey){ NET.sayKey = k; if (Date.now() + NET.off - R.say.at < 3000){ NET.sayUntil = Date.now() + 3000; if (R.say.seat !== m.seat) snd('step'); setTimeout(function(){ if (G && !busy) renderPeople(); }, 3100); } } }
  if (R.status === 'waiting' || !R.game){
    NET.queue = [];
    lobbySheet();
    return;
  }
  if (SHEET === 'lobby' || SHEET === 'start') closeSheet();
  NET.queue.push({ g:R.game, round:R.round, status:R.status });
  pump();
  if (!busy && G) render();
}
function pump(){
  while (NET.queue.length && !busy){
    var it = NET.queue.shift(), g = it.g;
    var same = it.round === NET.round && G;
    if (same && g.seq === G.seq){ G = g; NET.pending = false; if (g.phase === 'over' && SHEET !== 'over') overSheet(); continue; }
    if (same && g.seq === G.seq + 1 && NET.queue.length < 4 && g.last && g.last.length){
      NET.pending = false;
      play(g).then(function(){ pump(); if (!busy) render(); });
      return;
    }
    var fresh = it.round !== NET.round;
    NET.round = it.round; NET.pending = false;
    G = g; SEL = -1;
    if (fresh){ buildToks(); LOG = []; $('logl').innerHTML = ''; if (SHEET === 'over') closeSheet(); setNews(pn(g.turn) + ' 님부터 출발!'); }
    render();
    if (g.phase === 'over' && SHEET !== 'over') overSheet();
  }
}
function lobbySheet(){
  var R = NET.room, S = R.settings, host = R.host === NET.seat, n = S.players;
  var link = location.origin + location.pathname + '#' + R.code;
  var html = '<h2>대기실</h2><div class="code"><span class="hint">방 번호</span><b>' + R.code + '</b></div>' +
    '<div class="row2"><input class="field" id="wLink" readonly value="' + esc(link) + '" aria-label="초대 링크"><button class="btn" id="wCopy">링크 복사</button></div>' +
    '<h3>여행자 (' + n + '명)</h3><div class="lseats" id="wSeats"></div>' +
    '<h3>규칙' + (host ? '' : ' · 방장이 정해요') + '</h3>' +
    '<div class="ctl"><span>인원</span><div class="seg" id="wN"></div></div>' +
    '<div class="ctl"><span>한 번에 쓸 시간</span><div class="seg" id="wT"></div></div>' +
    '<div class="ctl"><span>빈자리 컴퓨터</span><div class="seg" id="wAi"></div></div>' +
    '<div id="wRules"></div><div id="wPub"></div>' +
    '<div class="btns"><button class="btn" id="wLeave">나가기</button>' + (host ? '<button class="btn main" id="wStart">출발!</button>' : '<span class="hint">방장이 출발하길 기다리는 중…</span>') + '</div>';
  var keep = SHEET === 'lobby' ? $('sheets').querySelector('.sheet').scrollTop : 0;
  var sh = openSheet(html, 'lobby');
  sh.scrollTop = keep;
  var box = sh.querySelector('#wSeats');
  for (var i = 0; i < n; i++){
    var s = R.seats[i] || {}, d = document.createElement('div');
    d.className = 'lseat' + (s.kind === 'human' ? '' : ' empty'); d.style.setProperty('--c', 'var(--p' + i + ')');
    d.innerHTML = '<span class="tok"></span><span class="n">' + (s.kind === 'human' ? esc(s.name) + (i === NET.seat ? ' (나)' : '') : '빈자리 · 시작하면 ' + BOTS[i]) + '</span><span class="tag">' + (s.kind === 'human' ? (i === R.host ? '방장' : (s.online ? '' : '연결 끊김')) : '') + '</span>';
    box.appendChild(d);
  }
  function set(k, v){ var o = {}; o[k] = v; NET.send({ t:'settings', settings:o }); }
  seg(sh.querySelector('#wN'), [[2,'2명'],[3,'3명'],[4,'4명']], n, function(v){ set('players', v); }, !host);
  seg(sh.querySelector('#wT'), [[0,'없음'],[15,'15초'],[20,'20초'],[30,'30초'],[60,'60초']], S.turnSec, function(v){ set('turnSec', v); }, !host);
  seg(sh.querySelector('#wAi'), [['easy','느긋한'],['normal','야무진']], S.ai, function(v){ set('ai', v); }, !host);
  rulesBox(sh.querySelector('#wRules'), { len:cfgToLen(S), start:S.start, triple:S.triple, buildOnBuy:S.buildOnBuy }, function(k, v){
    if (k === 'len'){ var c = lenToCfg(v, {}); NET.send({ t:'settings', settings:{ rounds:c.rounds, timeMin:c.timeMin } }); }
    else set(k, v);
  }, !host);
  sh.querySelector('#wPub').appendChild(swRow('빠른 참가에 공개', '켜면 모르는 사람도 빠른 참가로 들어올 수 있어요', !!S.public, function(){ set('public', !S.public); }, !host));
  sh.querySelector('#wCopy').onclick = function(){ copyLink(link); };
  sh.querySelector('#wLeave').onclick = function(){ leaveOnline(); };
  var st = sh.querySelector('#wStart'); if (st) st.onclick = function(){ st.disabled = true; NET.send({ t:'start' }); };
}
function sayDialog(){
  var html = '<h2>한마디</h2><div class="says">' + SAYS.map(function(s, i){ return '<button class="btn" data-k="' + i + '">' + esc(s) + '</button>'; }).join('') + '</div><div class="btns"><button class="btn" id="yClose">닫기</button></div>';
  var sh = openSheet(html, 'say');
  [].forEach.call(sh.querySelectorAll('[data-k]'), function(b){ b.onclick = function(){ NET.send({ t:'say', k:+b.dataset.k }); closeSheet(); }; });
  sh.querySelector('#yClose').onclick = closeSheet;
}

// ── 소리 ──
var ac = null;
function audio(){ if (!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, d, type, vol, when){
  var a = audio(); if (!a) return;
  var t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function snd(k){
  if (!store.sound) return;
  try{
    switch (k){
      case 'roll': for (var i = 0; i < 5; i++) tone(180 + Math.random() * 160, .05, 'square', .04, i * .1); break;
      case 'land': tone(140, .12, 'triangle', .18); break;
      case 'step': tone(660, .04, 'sine', .05); break;
      case 'coin': tone(988, .08, 'square', .05); tone(1319, .18, 'square', .05, .07); break;
      case 'pay': tone(392, .12, 'triangle', .1); tone(294, .2, 'triangle', .1, .1); break;
      case 'buy': tone(523, .1, 'triangle', .1); tone(784, .2, 'triangle', .1, .09); break;
      case 'build': tone(330, .07, 'square', .06); tone(330, .07, 'square', .06, .11); tone(660, .2, 'triangle', .1, .22); break;
      case 'key': [784, 988, 1175, 1568].forEach(function(f, i){ tone(f, .16, 'sine', .08, i * .07); }); break;
      case 'fly': tone(300, .5, 'sawtooth', .03); tone(600, .5, 'sine', .05, .1); break;
      case 'sad': tone(330, .2, 'triangle', .1); tone(262, .35, 'triangle', .1, .18); break;
      case 'turn': tone(880, .09, 'sine', .08); tone(1175, .14, 'sine', .08, .09); break;
      case 'beep': tone(1046, .07, 'square', .05); break;
      case 'win': [523, 659, 784, 1046, 784, 1046].forEach(function(f, i){ tone(f, .2, 'triangle', .1, i * .11); }); break;
    }
  }catch(e){}
}
function soundIcon(){ $('sndIco').innerHTML = store.sound ? '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9l5 6M22 9l-5 6"/>'; }

// ── 색종이 ──
function confetti(){
  var c = $('fx'); c.hidden = false;
  var x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight, cs = getComputedStyle(document.documentElement);
  var cols = ['--air-red', '--air-blue', '--gold', '--p2'].map(function(v){ return cs.getPropertyValue(v).trim() || '#c33'; });
  var ps = []; for (var i = 0; i < 120; i++) ps.push({ x:Math.random() * W, y:-Math.random() * H * .5, vx:(Math.random() - .5) * 2, vy:2 + Math.random() * 3, r:Math.random() * 6.28, c:cols[i % 4] });
  var t0 = Date.now();
  (function f(){
    x.clearRect(0, 0, W, H);
    ps.forEach(function(p){ p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-4, -2, 8, 4); x.restore(); });
    if (Date.now() - t0 < 3200) requestAnimationFrame(f); else { x.clearRect(0, 0, W, H); c.hidden = true; }
  })();
}
var toastT;
function toast(s){ var t = $('toast'); t.textContent = s; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 2400); }

function demoBoard(){ // 시작 화면 뒤에 보일 빈 판
  G = WT.newGame([{ name:'나' }, { name:BOTS[0], ai:'normal' }], {}, 0, 1, Date.now());
  MODE = 'local'; DEMO = true; buildToks(); showDice([5, 2]); render(); setNews('주사위를 굴려 세계를 한 바퀴!');
}

(function boot(){
  drawBoard(); soundIcon(); showDice([5, 2]);
  $('bSnd').onclick = function(){ store.sound = !store.sound; save(); soundIcon(); if (store.sound) snd('coin'); };
  $('bMenu').onclick = menuSheet;
  $('bSay').onclick = sayDialog;
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && SHEET && SHEET !== 'start' && SHEET !== 'lobby') closeSheet();
    if ((e.key === ' ' || e.key === 'Enter') && !SHEET && keySkip){ e.preventDefault(); keySkip(); return; }
    if (e.key === ' ' && !SHEET && G && G.phase === 'roll' && myTurn() && !busy && document.activeElement === document.body){ e.preventDefault(); act({ type:'roll' }); }
  });
  window.addEventListener('resize', function(){ if (G) placeToks(); });
  var hashCode = (location.hash.match(/^#(\d{6})$/) || [])[1];
  var lastRoom = lsGet('wt-room');
  if (SERVER && lastRoom && store.netName && (!hashCode || hashCode === lastRoom)){ demoBoard(); goOnline(lastRoom, store.netName); return; }
  if (SERVER && hashCode){ demoBoard(); setupSheet('online'); return; }
  if (store.game && store.game.v === 1 && store.game.phase !== 'over'){
    G = store.game; MODE = 'local';
    if (G.cfg.timeMin && store.seen){ G.t0 += Math.max(0, Date.now() - store.seen); }
    buildToks(); render(); setNews('하던 여행을 이어서 해요 · ' + pn(G.turn) + ' 님 차례'); next();
    return;
  }
  demoBoard(); setupSheet();
})();
</script>
